<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica & Estética - Sistema de Gestão</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para ícones -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fa-solid fa-hospital-user me-2"></i>Gestão de Clínicas SENAI</a>
        </div>
    </nav>

    <div class="container mb-5">
        <!-- Navegação por Abas -->
        <ul class="nav nav-pills mb-4 justify-content-center" id="pago-tabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="tab-agendamentos" data-bs-toggle="pill" data-bs-target="#pane-agendamentos" type="button" role="tab">
                    <i class="fa-solid fa-calendar-check me-2"></i>Agendamentos
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab-clientes" data-bs-toggle="pill" data-bs-target="#pane-clientes" type="button" role="tab">
                    <i class="fa-solid fa-users me-2"></i>Clientes
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab-profissionais" data-bs-toggle="pill" data-bs-target="#pane-profissionais" type="button" role="tab">
                    <i class="fa-solid fa-user-doctor me-2"></i>Médicos / Profissionais
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab-servicos" data-bs-toggle="pill" data-bs-target="#pane-servicos" type="button" role="tab">
                    <i class="fa-solid fa-stethoscope me-2"></i>Tipos de Consulta
                </button>
            </li>
        </ul>

        <div class="tab-content" id="paged-content">
            
            <!-- ABA 1: AGENDAMENTOS -->
            <div class="tab-pane fade show active" id="pane-agendamentos" role="tabpanel">
                <div class="row g-4">
                    <div class="col-lg-4">
                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-primary text-white">
                                <h5 class="mb-0"><i class="fa-solid fa-calendar-plus me-2"></i>Novo Agendamento</h5>
                            </div>
                            <div class="card-body">
                                <form id="form-agendamento">
                                    <div class="mb-3">
                                        <label for="clienteId" class="form-label">Cliente</label>
                                        <select class="form-select" id="clienteId" required>
                                            <option value="">A carregar clientes...</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label for="profissionalId" class="form-label">Profissional</label>
                                        <select class="form-select" id="profissionalId" required>
                                            <option value="">A carregar profissionais...</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label for="servicoId" class="form-label">Serviço</label>
                                        <select class="form-select" id="servicoId" required>
                                            <option value="">A carregar serviços...</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label for="dataHoraInicio" class="form-label">Início</label>
                                        <input type="datetime-local" class="form-control" id="dataHoraInicio" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="dataHoraFim" class="form-label">Término</label>
                                        <input type="datetime-local" class="form-control" id="dataHoraFim" required>
                                    </div>
                                    <button type="submit" class="btn btn-success w-100"><i class="fa-solid fa-check me-2"></i>Salvar Agendamento</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-8">
                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                                <h5 class="mb-0 text-primary fw-bold"><i class="fa-solid fa-list me-2"></i>Agendamentos Registados</h5>
                                <button class="btn btn-outline-primary btn-sm" onclick="carregarAgendamentos()">
                                    <i class="fa-solid fa-rotate-right me-1"></i> Atualizar
                                </button>
                            </div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover mb-0 align-middle">
                                        <thead class="table-light">
                                            <tr>
                                                <th>ID</th>
                                                <th>Início</th>
                                                <th>Fim</th>
                                                <th>Status</th>
                                                <th class="text-center">Ações</th>
                                            </tr>
                                        </thead>
                                        <tbody id="tabela-agendamentos"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ABA 2: CLIENTES -->
            <div class="tab-pane fade" id="pane-clientes" role="tabpanel">
                <div class="row g-4">
                    <div class="col-lg-4">
                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-secondary text-white">
                                <h5 class="mb-0"><i class="fa-solid fa-user-plus me-2"></i>Novo Cliente</h5>
                            </div>
                            <div class="card-body">
                                <form id="form-cliente">
                                    <div class="mb-3">
                                        <label for="nomeCliente" class="form-label">Nome Completo</label>
                                        <input type="text" class="form-control" id="nomeCliente" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="emailCliente" class="form-label">E-mail</label>
                                        <input type="email" class="form-control" id="emailCliente" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="senhaCliente" class="form-label">Senha</label>
                                        <input type="password" class="form-control" id="senhaCliente" value="123456" required>
                                    </div>
                                    <button type="submit" class="btn btn-secondary w-100"><i class="fa-solid fa-user-check me-2"></i>Registar Cliente</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-8">
                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                                <h5 class="mb-0 text-secondary fw-bold"><i class="fa-solid fa-users me-2"></i>Clientes Registados</h5>
                                <button class="btn btn-outline-secondary btn-sm" onclick="carregarClientes()">
                                    <i class="fa-solid fa-rotate-right me-1"></i> Atualizar
                                </button>
                            </div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover mb-0 align-middle">
                                        <thead class="table-light">
                                            <tr>
                                                <th>ID</th>
                                                <th>Nome</th>
                                                <th>E-mail</th>
                                            </tr>
                                        </thead>
                                        <tbody id="tabela-clientes"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ABA 3: PROFISSIONAIS -->
            <div class="tab-pane fade" id="pane-profissionais" role="tabpanel">
                <div class="row g-4">
                    <div class="col-lg-4">
                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-dark text-white">
                                <h5 class="mb-0"><i class="fa-solid fa-user-doctor me-2"></i>Novo Profissional</h5>
                            </div>
                            <div class="card-body">
                                <form id="form-profissional">
                                    <div class="mb-3">
                                        <label for="profNome" class="form-label">Nome do Profissional</label>
                                        <input type="text" class="form-control" id="profNome" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="profEmail" class="form-label">E-mail</label>
                                        <input type="email" class="form-control" id="profEmail" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="profEspecialidade" class="form-label">Especialidade</label>
                                        <select class="form-select" id="profEspecialidade" required>
                                            <option value="">Selecione uma especialidade...</option>
                                            <option value="Dermatologia">Dermatologia</option>
                                            <option value="Estética Avançada">Estética Avançada</option>
                                            <option value="Fisioterapia">Fisioterapia</option>
                                        </select>
                                    </div>
                                    <button type="submit" class="btn btn-dark w-100"><i class="fa-solid fa-check me-2"></i>Registar Profissional</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-8">
                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                                <h5 class="mb-0 text-dark fw-bold"><i class="fa-solid fa-user-doctor me-2"></i>Profissionais Registados</h5>
                                <button class="btn btn-outline-dark btn-sm" onclick="carregarProfissionais()">
                                    <i class="fa-solid fa-rotate-right me-1"></i> Atualizar
                                </button>
                            </div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover mb-0 align-middle">
                                        <thead class="table-light">
                                            <tr>
                                                <th>ID</th>
                                                <th>Nome</th>
                                                <th>Especialidade</th>
                                            </tr>
                                        </thead>
                                        <tbody id="tabela-profissionais"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ABA 4: SERVIÇOS -->
            <div class="tab-pane fade" id="pane-servicos" role="tabpanel">
                <div class="row g-4">
                    <div class="col-lg-4">
                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-success text-white">
                                <h5 class="mb-0"><i class="fa-solid fa-stethoscope me-2"></i>Novo Tipo de Consulta</h5>
                            </div>
                            <div class="card-body">
                                <form id="form-servico">
                                    <div class="mb-3">
                                        <label for="servNome" class="form-label">Nome do Serviço</label>
                                        <input type="text" class="form-control" id="servNome" placeholder="Ex: Limpeza de Pele" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="servPreco" class="form-label">Preço (R$)</label>
                                        <input type="number" step="0.01" class="form-control" id="servPreco" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="servDuracao" class="form-label">Duração (Minutos)</label>
                                        <input type="number" class="form-control" id="servDuracao" value="30" required>
                                    </div>
                                    <button type="submit" class="btn btn-success w-100"><i class="fa-solid fa-check me-2"></i>Registar Serviço</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-8">
                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                                <h5 class="mb-0 text-success fw-bold"><i class="fa-solid fa-stethoscope me-2"></i>Serviços Registados</h5>
                                <button class="btn btn-outline-success btn-sm" onclick="carregarServicosTab()">
                                    <i class="fa-solid fa-rotate-right me-1"></i> Atualizar
                                </button>
                            </div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover mb-0 align-middle">
                                        <thead class="table-light">
                                            <tr>
                                                <th>ID</th>
                                                <th>Nome</th>
                                                <th>Preço</th>
                                                <th>Duração</th>
                                            </tr>
                                        </thead>
                                        <tbody id="tabela-servicos"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script Principal -->
    <script src="app.js"></script>
</body>
</html>
